services:
  # Backend service - Using Python runtime for full build and start command support
  - type: web
    name: backdoor-ai-backend
    env: python
    buildCommand: |
      # Install backend dependencies
      pip install -r backend/requirements.txt
      
      echo "===== BUILD STAGE (Free Tier) ====="
      # Create only the essential model directory for memory efficiency
      mkdir -p /tmp/model
      
      # Enable memory-saving mode with external model server
      export MINIMIZE_MEMORY_USAGE=true
      export USE_EXTERNAL_MODEL_SERVER=true
      
      echo "===== BUILD COMPLETE ====="
    startCommand: |
      echo "===== STARTING APPLICATION (Free Tier) ====="
      
      # Enable external model server for memory efficiency
      export USE_EXTERNAL_MODEL_SERVER=true
      export MODEL_SERVER_URL=http://localhost:5000
      echo "External model server enabled for memory efficiency"
      
      # Start the model server in the background
      echo "Starting model server..."
      python backend/model_server.py &
      MODEL_SERVER_PID=$!
      
      # Wait for model server to start
      echo "Waiting for model server to start..."
      sleep 5
      
      # Start the application
      cd backend
      python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: info
      # Flag to indicate we're running on Render
      - key: RUNNING_ON_RENDER
        value: "true"
      # Enable memory-saving mode
      - key: MINIMIZE_MEMORY_USAGE
        value: "true"
      # Enable external model server for memory efficiency
      - key: USE_EXTERNAL_MODEL_SERVER
        value: "true"
      # Set model server URL
      - key: MODEL_SERVER_URL
        value: "http://localhost:5000"
    healthCheckPath: /

  # Frontend service
  - type: web
    name: backdoor-ai-frontend
    env: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    envVars:
      - key: REACT_APP_API_URL
        fromService:
          name: backdoor-ai-backend
          type: web
          property: host
      - key: BACKEND_URL
        fromService:
          name: backdoor-ai-backend
          type: web
          property: hostport
