services:
  # Backend service for ML model - Using Docker runtime
  - type: web
    name: backdoor-ai-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: info
      # Use /tmp/model for Free Tier compatibility
      - key: MODEL_DATA_PATH
        value: /tmp/model
      - key: BACKDOOR_MODEL_SEARCH_PATHS
        value: "/tmp/model,/app/app/model,/app/backend/app/model,/app/backend,/app"
      # Flag to indicate we're running on Render
      - key: RUNNING_ON_RENDER
        value: "true"
      # Disable model download timeout for initial load
      - key: MODEL_LOAD_TIMEOUT
        value: "120"
    healthCheckPath: /

  # Frontend service
  - type: web
    name: backdoor-ai-frontend
    env: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    envVars:
      - key: REACT_APP_API_URL
        fromService:
          name: backdoor-ai-backend
          type: web
          property: host
      - key: BACKEND_URL
        fromService:
          name: backdoor-ai-backend
          type: web
          property: hostport